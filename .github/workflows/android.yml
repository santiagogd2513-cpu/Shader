name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      # Java runtimes bundled in the APK. The original PojavLauncher builds are tried first,
      # the AngelAuraMC (Amethyst) builds are the fallback if those artifacts expired.
      - name: Get JRE 8 (PojavLauncher)
        id: jre8
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav
      - name: Get JRE 8 (fallback)
        if: steps.jre8.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Get JRE 17 (PojavLauncher)
        id: jre17
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav
      - name: Get JRE 17 (fallback)
        if: steps.jre17.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav

      - name: Get JRE 21 (PojavLauncher)
        id: jre21
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav
      - name: Get JRE 21 (fallback)
        if: steps.jre21.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      - name: Report bundled runtimes
        run: |
          for d in jre jre-new jre-21; do
            echo "== $d"; ls app_pojavlauncher/src/main/assets/components/$d 2>/dev/null || echo "MISSING (install it from Settings > Java runtimes)"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/ShaderLauncher-debug.apk
          md5sum out/ShaderLauncher-debug.apk > out/ShaderLauncher-debug.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaderLauncher-debug
          path: out/ShaderLauncher-debug.*

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shader-launcher-${{ github.run_number }}
          name: Shader Launcher (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/ShaderLauncher-debug.apk
          body: |
            APK de Shader Launcher (basado en PojavLauncher).
            Descarga **ShaderLauncher-debug.apk** e instálalo en Android.
            Se instala aparte de PojavLauncher.
